
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GrowDesign AI Toolkit | Caption Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 50px 20px;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      color: #facc15;
      font-size: 36px;
    }

    h2 {
      margin-top: 40px;
    }

    .description {
      color: #d1d5db;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 22px 0 10px;
      font-weight: bold;
    }

    select {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #111827;
      font-size: 16px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }

    .generate-btn {
      background: #facc15;
      color: #111827;
    }

    .generate-btn:hover {
      background: #eab308;
    }

    .copy-btn {
      background: #374151;
      color: white;
      border: 1px solid #6b7280;
    }

    .copy-btn:hover {
      background: #4b5563;
    }

    .caption-box {
      margin-top: 30px;
      padding: 25px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
    }

    #caption {
      font-size: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 22px;
      color: #86efac;
      font-size: 14px;
    }

    footer {
      margin-top: 50px;
      color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 28px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>GrowDesign AI Toolkit 🎨</h1>

    <p class="description">
      Free creative tools for designers and creators.
    </p>

    <h2>Caption Idea Generator</h2>

    <p class="description">
      Choose a category and writing style to discover
      caption ideas for your social media posts.
    </p>

    <label for="category">Choose a category</label>

    <select id="category">
      <option value="design">🎨 Design</option>
      <option value="business">💼 Business</option>
      <option value="fashion">👗 Fashion</option>
      <option value="travel">✈️ Travel</option>
      <option value="lifestyle">🌿 Lifestyle</option>
    </select>

    <label for="style">Choose a writing style</label>

    <select id="style">
      <option value="professional">Professional</option>
      <option value="funny">Funny</option>
      <option value="motivational">Motivational</option>
    </select>

    <div>
      <button class="generate-btn" onclick="generateCaption()">
        Generate Caption
      </button>
    </div>

    <section class="caption-box">

      <p id="caption" aria-live="polite">
        Your caption will appear here.
      </p>

      <button class="copy-btn" onclick="copyCaption()">
        📋 Copy Caption
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </section>

    <footer>
      Made with ❤️ by GrowDesign AI
      <p>Free and open-source creative toolkit.</p>
    </footer>

  </main>

  <script>
    const captions = {
      design: {
        professional: [
          "Thoughtful design creates meaningful experiences.",
          "Good design balances creativity and purpose."
        ],
        funny: [
          "My pixels are having a creative crisis. 🎨",
          "Just one more revision... said every designer ever. 😅"
        ],
        motivational: [
          "Your next masterpiece starts with one idea. ✨",
          "Create boldly. Your imagination has no limits. 🚀"
        ]
      },

      business: {
        professional: [
          "Consistent progress builds lasting results.",
          "Great businesses grow through trust and innovation."
        ],
        funny: [
          "Running on coffee, deadlines, and big ideas. ☕",
          "CEO of having too many tabs open. 💻"
        ],
        motivational: [
          "Build boldly. Grow every day. 🚀",
          "Every success story starts with a first step."
        ]
      },

      fashion: {
        professional: [
          "Personal style is a form of visual expression.",
          "Fashion reflects creativity and individuality."
        ],
        funny: [
          "My wardrobe has more ideas than my calendar. 👗",
          "Too stylish to have nothing to wear. 😎"
        ],
        motivational: [
          "Wear your confidence with pride. ✨",
          "Express yourself without limits."
        ]
      },

      travel: {
        professional: [
          "Discovering new destinations and perspectives.",
          "Travel creates opportunities to understand the world."
        ],
        funny: [
          "My suitcase has commitment issues. ✈️",
          "Out of office. Into adventure. 🌴"
        ],
        motivational: [
          "Every journey begins with a brave first step. 🌍",
          "Go somewhere new. Discover something extraordinary."
        ]
      },

      lifestyle: {
        professional: [
          "Creating balance through intentional choices.",
          "A meaningful lifestyle starts with mindful habits."
        ],
        funny: [
          "Today's productivity goal: find my coffee. ☕",
          "Currently accepting snacks and good vibes. 😄"
        ],
        motivational: [
          "Small positive habits lead to meaningful change. 🌿",
          "Make today another step toward your best life."
        ]
      }
    };

    let currentCaption = "";

    function resetCaption() {
      currentCaption = "";
      document.getElementById("caption").textContent =
        "Your caption will appear here.";
      document.getElementById("message").textContent = "";
    }

    function generateCaption() {
      const category =
        document.getElementById("category").value;

      const style =
        document.getElementById("style").value;

      const options = captions[category][style];

      const randomIndex =
        Math.floor(Math.random() * options.length);

      currentCaption = options[randomIndex];

      document.getElementById("caption").textContent =
        currentCaption;

      document.getElementById("message").textContent = "";
    }

    async function copyCaption() {
      const message = document.getElementById("message");

      if (!currentCaption) {
        message.textContent = "Generate a caption first!";
        return;
      }

      try {
        await navigator.clipboard.writeText(currentCaption);
        message.textContent = "✅ Caption copied successfully!";
      } catch (error) {
        message.textContent =
          "Copy failed. Please select and copy the caption manually.";
      }
    }

    document.getElementById("category")
      .addEventListener("change", resetCaption);

    document.getElementById("style")
      .addEventListener("change", resetCaption);
  </script>

</body>
</html>
